<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Verbete">
  <!--
    The mark is this game's own "correct" tile, drawn once: a sort (a block of
    metal type) inked solid, with its letter knocked out in the sheet. Same
    three ingredients src/index.css's `.sorte-certa` uses, reading the values
    straight off src/styles/tokens.css: the ink fill, the knockout glyph, and
    the near-square corner of the tile radius. The tab therefore carries the
    identical object the board is made of rather than a separate logo.
    Original geometry, drawn here from those tokens; no existing mark is
    traced or referenced.

    NOTE for whoever edits this comment: an XML comment may not contain two
    consecutive hyphens, so the CSS custom properties above are named in
    words rather than written out. A stray token name here turns the whole
    file into a parse error, and a browser renders nothing at all.

    Everything is sized for 16px first, the only size that is genuinely hard.
    At 16 CSS px a 32-unit viewBox halves, so the V's 4.6-unit stroke lands at
    2.3 device px on a 1x screen, thick enough to survive without hinting,
    and the block keeps a full-bleed silhouette, which is what actually
    identifies the tab at a glance. Nothing thinner than that stroke exists in
    the file: no nick, no bevel, no inner rule, all of which vanish below
    about 24px and only muddy the silhouette above it.

    The two colours flip with the browser's own scheme rather than sitting
    fixed: a near-black block is close to invisible on a dark tab strip. That
    is the same "inked block on the press bed" inversion tokens.css already
    performs for the game itself. A browser that ignores the media query keeps
    the light pair, which is the safe default.
  -->
  <style>
    .bloco { fill: #1e1b17; }
    .letra { stroke: #e9e5da; }
    @media (prefers-color-scheme: dark) {
      .bloco { fill: #ede7da; }
      .letra { stroke: #131210; }
    }
  </style>
  <rect class="bloco" x="1" y="1" width="30" height="30" rx="2" />
  <path
    class="letra"
    d="M9.6 8.4 16 20.4 22.4 8.4"
    fill="none"
    stroke-width="4.6"
    stroke-linecap="butt"
    stroke-linejoin="miter"
  />
</svg>
